name: Verify Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the signed public APK
        run: |
          curl --fail --location --retry 3 https://github.com/Larik1329/larik-chat-desktop/releases/download/android-v0.1.0/Larik-Chat-0.1.0-android.apk -o /tmp/larik-chat.apk
          curl --fail --location https://github.com/Larik1329/larik-chat-desktop/releases/download/android-v0.1.0/SHA256SUMS-android.txt -o /tmp/SHA256SUMS.txt
          cp /tmp/larik-chat.apk /tmp/Larik-Chat-0.1.0-android.apk
          cd /tmp && sha256sum -c SHA256SUMS.txt
      - name: Install and launch Android APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/verify-android-apk.sh
      - name: Upload Android verification screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-verification
          path: /tmp/android-verification/
          retention-days: 7
