name: Verify minimized Windows capture
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate client version
        required: true
        default: '0.1.10'
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract compiled release candidate
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:CANDIDATE_VERSION
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $installer = Join-Path $env:RUNNER_TEMP 'candidate.exe'
          Invoke-WebRequest "https://github.com/Larik1329/larik-chat-desktop/releases/download/v$v/Larik-Chat-$v-win-x64.exe" -OutFile $installer
          & 7z x $installer "-o$env:RUNNER_TEMP\candidate" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          $payload = Get-ChildItem "$env:RUNNER_TEMP\candidate" -Recurse -Filter 'app-64.7z' | Select-Object -First 1
          if (-not $payload) { throw 'Missing app payload' }
          & 7z x $payload.FullName "-o$env:RUNNER_TEMP\app" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Payload extraction failed' }
          Invoke-WebRequest 'https://github.com/electron/electron/releases/download/v44.9.1/electron-v44.9.1-win32-x64.zip' -OutFile "$env:RUNNER_TEMP\electron.zip"
          Expand-Archive "$env:RUNNER_TEMP\electron.zip" "$env:RUNNER_TEMP\electron"
      - name: Verify actual Win32 enumeration, restore and captured video frame
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CAPTURE_MODULE = "$env:RUNNER_TEMP\app\resources\app.asar\src\windows-capture.cjs"
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\scripts\verify-minimized-windows.cjs'
          $p = Start-Process "$env:RUNNER_TEMP\electron\electron.exe" -ArgumentList @('"' + $script + '"') -PassThru -RedirectStandardOutput native-capture.log -RedirectStandardError native-capture-error.log
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Capture verification timed out' }
          Get-Content native-capture.log
          Get-Content native-capture-error.log
          if ($p.ExitCode -ne 0) { throw "Capture verification failed: $($p.ExitCode)" }
          if (-not (Select-String -Path native-capture.log -Pattern 'WINDOWS_NATIVE_WINDOW_CAPTURE_FRAME_PASS' -Quiet)) { throw 'Missing actual captured-frame proof' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-window-capture
          path: native-capture*.log
          retention-days: 14
